name: CI

on:
  push:
  pull_request:

jobs:
  # the library and the tests; the viewer needs the X11/Wayland development
  # packages for the SDL2 of vcpkg, it is built on Windows
  linux:
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - uses: actions/checkout@v4
      - name: vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: Configure
        run: cmake --preset linux -DR4_BUILD_APPS=OFF
      - name: Build
        run: cmake --build --preset linux -j
      - name: Test
        run: ctest --preset linux --output-on-failure

  windows:
    runs-on: windows-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
    steps:
      - uses: actions/checkout@v4
      - name: vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
      # the runners may not have the 2022 version of Visual Studio
      - name: Configure
        run: cmake --preset windows-vs
      - name: Build
        run: cmake --build --preset windows-vs
      - name: Test
        run: ctest --preset windows-vs --output-on-failure
